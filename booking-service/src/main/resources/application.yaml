spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/events_booking_app?currentSchema=booking}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: booking
    default-schema: booking

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8084/eureka/}"
  instance:
    prefer-ip-address: true