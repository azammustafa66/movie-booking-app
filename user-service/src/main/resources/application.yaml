### Spring Config ###
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: user-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/events_booking_app}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

### JWT Config ###
jwt:
  secret: ${JWT_SECRET:8a892b1f8b1a8f9c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c}
  access-token-expiration-seconds: ${ACCESS_TOKEN_EXPIRATION:900}
  refresh-token-expiration-seconds: ${REFRESH_TOKEN_EXPIRATION:86400}

### Server Config ###
server:
  port: 8081

### Service Discovery ###
eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8084/eureka/}"
  instance:
    prefer-ip-address: true
