services:
  catalog-db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${CATALOG_DB_USERNAME:-catalog_service}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-change-catalog-db-password}
      POSTGRES_DB: ${CATALOG_DB_NAME:-catalog_db}
    ports:
      - "${CATALOG_DB_PORT:-5434}:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    networks:
      - movie-booking
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USERNAME:-catalog_service} -d ${CATALOG_DB_NAME:-catalog_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      catalog-db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DB_URL: jdbc:postgresql://catalog-db:5432/${CATALOG_DB_NAME:-catalog_db}?currentSchema=catalog
      DB_USERNAME: ${CATALOG_DB_USERNAME:-catalog_service}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:-change-catalog-db-password}
      EUREKA_URL: ${EUREKA_URL:-http://discovery-service:8084/eureka/}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-true}
      EUREKA_INSTANCE_HOSTNAME: ${CATALOG_EUREKA_INSTANCE_HOSTNAME:-localhost}
      EUREKA_INSTANCE_PORT: ${CATALOG_SERVICE_PORT:-8082}
    ports:
      - "${CATALOG_SERVICE_PORT:-8082}:8082"
    networks:
      - movie-booking

networks:
  movie-booking:
    external: true
    name: movie-booking

volumes:
  catalog-db-data:
    name: movie-booking-catalog-db-data
