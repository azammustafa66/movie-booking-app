spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/events_booking_app?currentSchema=catalog}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: catalog
    default-schema: catalog

server:
  port: 8082
