spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  # Defaults target a local dev SMTP catcher (e.g. MailHog on 1025, no auth) so
  # this works out of the box without real credentials. Point MAIL_HOST/PORT at
  # a real provider (Gmail, SendGrid, Mailtrap, ...) and set MAIL_USERNAME/
  # MAIL_PASSWORD + MAIL_SMTP_AUTH=true/MAIL_SMTP_STARTTLS=true for production.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

notification:
  mail:
    from: ${MAIL_FROM:no-reply@moviebooking.local}

server:
  port: 8085
