spring:
  application:
    name: api-gateway
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # User Service
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/user/**

            # Catalog Service — note /internal/** is deliberately not routed
            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/api/v1/admin/**,/api/v1/vendor/**,/api/v1/movies/**,/api/v1/shows/**,/api/v1/seats/**,/api/v1/genres/**,/api/v1/screens/**,/api/v1/theatres/**

            # Booking Service
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8084/eureka/}"
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    non-secure-port: ${EUREKA_INSTANCE_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:8a892b1f8b1a8f9c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c}
