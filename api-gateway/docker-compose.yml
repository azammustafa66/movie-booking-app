services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ../.env
    environment:
      EUREKA_URL: http://discovery-service:8084/eureka/
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - movie-booking

networks:
  movie-booking:
    external: true
    name: movie-booking
