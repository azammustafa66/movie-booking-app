services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ../.env
    environment:
      EUREKA_URL: ${EUREKA_URL:-http://discovery-service:8084/eureka/}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-true}
      EUREKA_INSTANCE_HOSTNAME: ${GATEWAY_EUREKA_INSTANCE_HOSTNAME:-localhost}
      EUREKA_INSTANCE_PORT: ${GATEWAY_PORT:-8080}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - movie-booking

networks:
  movie-booking:
    external: true
    name: movie-booking
