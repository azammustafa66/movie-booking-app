services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-movieapp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-movieapp-secret}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - movie-booking
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  rabbitmq-data:
    name: movie-booking-rabbitmq-data

networks:
  movie-booking:
    external: true
    name: movie-booking
