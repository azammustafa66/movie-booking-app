services:
  discovery-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ../.env
    environment:
      EUREKA_URL: http://discovery-service:8084/eureka/
    ports:
      - "${DISCOVERY_PORT:-8084}:8084"
    networks:
      - movie-booking

networks:
  movie-booking:
    external: true
    name: movie-booking
